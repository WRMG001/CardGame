{% extends 'base.html' %}

{% block content %}
<div style="max-width: 480px; margin: 50px auto; text-align: center; color: #fff; font-family: 'Kanit', sans-serif;">

  <div style="background: #1e1e24; border-radius: 16px; padding: 35px 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #ff4d6d;">
    
    <div style="font-size: 55px; margin-bottom: 10px;">⏳</div>
    
    <h2 style="color: #ff4d6d; margin-bottom: 10px; font-size: 24px;">สิทธิ์การเปิดไพ่หมดแล้ว</h2>
    
    <p style="color: #ccc; font-size: 16px; line-height: 1.6; margin-bottom: 20px;">
      สวัสดีครับคุณ <strong style="color: #00f5d4;">{{ player_name }}</strong><br>
      คุณใช้สิทธิ์เปิดไพ่ครบ <strong style="color: #ffb703;">{{ max_limit }} รอบ</strong> ประจำวันนี้แล้ว
    </p>

    <div style="background: #2b2b36; border-radius: 10px; padding: 18px; margin: 20px 0; font-size: 15px; border: 1px solid #3d3d4e;">
      คะแนนสะสมปัจจุบัน: <strong style="color: {% if total_score < 0 %}#ff4d6d{% else %}#00f5d4{% endif %}; font-size: 20px;">{{ total_score }}</strong> แต้ม
      <span style="color: #ffb703; display: block; margin-top: 8px; font-size: 13px;">💡 สิทธิ์การเล่นจะถูกรีเซ็ตใหม่อีกครั้งในวันพรุ่งนี้!</span>
    </div>

    <div style="display: flex; gap: 12px; justify-content: center; margin-top: 25px;">
      <a href="/home" style="text-decoration: none; flex: 1;">
        <button style="width: 100%; padding: 12px; font-size: 15px; font-weight: bold; background: #3a3b4c; color: white; border: none; border-radius: 8px; cursor: pointer;">
          🏠 กลับหน้าหลัก
        </button>
      </a>

      <a href="/ranking" style="text-decoration: none; flex: 1;">
        <button style="width: 100%; padding: 12px; font-size: 15px; font-weight: bold; background: #ffb703; color: #111; border: none; border-radius: 8px; cursor: pointer;">
          🏆 ดูตารางคะแนน
        </button>
      </a>
    </div>

  </div>

</div>
{% endblock %}
