{% extends 'base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 50px auto; text-align: center; color: #fff; font-family: sans-serif;">

  <div style="background: #1e1e24; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #ff4d6d;">
    
    <div style="font-size: 50px; margin-bottom: 10px;">⏳</div>
    
    <h2 style="color: #ff4d6d; margin-bottom: 10px;">สิทธิ์การเปิดไพ่หมดแล้ว</h2>
    
    <p style="color: #ccc; font-size: 15px; line-height: 1.6;">
      สวัสดีครับคุณ <strong>{{ player_name }}</strong><br>
      คุณใช้สิทธิ์เปิดไพ่ครบ <strong>{{ max_limit }} รอบ</strong> ประจำวันนี้แล้ว
    </p>

    <div style="background: #2b2b36; border-radius: 8px; padding: 15px; margin: 20px 0; font-size: 14px; color: #aaa;">
      คะแนนสะสมปัจจุบันของคุณ: <strong style="color: #00f5d4; font-size: 18px;">{{ total_score }}</strong> แต้ม<br>
      <span style="color: #ffb703; display: block; margin-top: 8px;">💡 สิทธิ์การเล่นจะถูกรีเซ็ตใหม่อีกครั้งในวันพรุ่งนี้!</span>
    </div>

    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
      <a href="/home">
        <button style="padding: 10px 20px; font-size: 15px; font-weight: bold; background: #4a4e69; color: white; border: none; border-radius: 6px; cursor: pointer;">
          🏠 กลับหน้าหลัก
        </button>
      </a>

      <a href="/ranking">
        <button style="padding: 10px 20px; font-size: 15px; font-weight: bold; background: #ffb703; color: black; border: none; border-radius: 6px; cursor: pointer;">
          🏆 ดูตารางคะแนน
        </button>
      </a>
    </div>

  </div>

</div>
{% endblock %}
