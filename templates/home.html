{% extends 'base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 40px auto; text-align: center; color: #fff; font-family: 'Kanit', sans-serif;">

  <div style="margin-bottom: 25px;">
    <div style="font-size: 40px;">🎴</div>
    <h1 style="margin: 5px 0; font-size: 28px; letter-spacing: 1px;">Card Game</h1>
    <span style="color: #777; font-size: 12px;">Version 0.2</span>
  </div>

  <div style="background: #1e1e24; border-radius: 16px; padding: 20px; border: 1px solid #2d2d3a; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
    <h3 style="color: #00f5d4; margin: 0 0 5px 0; font-size: 20px;">Welcome {{ player_name }}</h3>
    <p style="color: #aaa; margin: 0 0 10px 0; font-size: 13px;">Code: <strong>{{ player_id }}</strong> | Role: {{ role }}</p>
    <div style="font-size: 16px; font-weight: bold; color: #ffb703;">
      คะแนนสะสม: {{ session.get('total_score', 0) }} แต้ม
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <a href="/game" style="text-decoration: none;">
      <button style="width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background: #ffffff; color: #111; border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        🎴 เปิดไพ่ (เสีย 1 แต้ม/รอบ)
      </button>
    </a>

    <a href="/ranking" style="text-decoration: none;">
      <button style="width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background: #ffffff; color: #111; border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        🏆 ตารางคะแนน & รายชื่อ
      </button>
    </a>

    <a href="/history" style="text-decoration: none;">
      <button style="width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background: #ffffff; color: #111; border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        📜 ประวัติการเล่น
      </button>
    </a>

    <a href="/logout" style="text-decoration: none; margin-top: 10px;">
      <button style="width: 100%; padding: 12px; font-size: 15px; font-weight: bold; background: #ff4d6d; color: white; border: none; border-radius: 10px; cursor: pointer;">
        🚪 Logout
      </button>
    </a>
  </div>

</div>
{% endblock %}
