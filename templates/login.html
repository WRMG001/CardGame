{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 2px solid #444; border-radius: 10px; background: #222; text-align: center; color: white;">
  <h2>🔐 เข้าสู่ระบบเกมไพ่</h2>
  <p style="color: #aaa; font-size: 14px;">กรอกรหัสประจำตัว (เช่น C014, BA002, W010)</p>

  {% if error %}
    <p style="color: #ff4d4d; font-weight: bold; font-size: 14px;">{{ error }}</p>
  {% endif %}

  <form action="/login" method="POST" style="margin-top: 20px;">
    <input 
      type="text" 
      name="player_id" 
      placeholder="กรอกรหัสผู้เล่น..." 
      required 
      style="padding: 10px; font-size: 18px; width: 80%; text-align: center; border-radius: 5px; border: 1px solid #666;"
    >
    <br><br>
    <button type="submit" style="padding: 10px 25px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px;">
      🚀 เข้าสู่ระบบ
    </button>
  </form>
</div>
{% endblock %}
